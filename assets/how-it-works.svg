<text x="930" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >linked notes,</text>
<text x="930" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >index.md, log.md</text>
