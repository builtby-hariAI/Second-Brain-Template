<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="how-it-works-title how-it-works-desc">
<title id="how-it-works-title">How the second brain works</title>
<desc id="how-it-works-desc">Your files go into raw/, Claude ingests them into linked wiki notes, and answers your questions with links to those notes.</desc>
