<rect x="910" y="370" width="214" height="4" rx="2" fill="#7cff8a"/>
<text x="930" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#e6f7ff" text-anchor="start" >Answer</text>
<text x="930" y="434" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >with [[links]] to</text>
<text x="930" y="456" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >your own notes</text>
<text x="40" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#e6f7ff" text-anchor="start" >Three habits keep it healthy:</text>
<text x="40" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#00e5ff" text-anchor="start" >1</text>
<text x="64" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e6f7ff" text-anchor="start" >Ingest</text>
<text x="140" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#9fb0c8" text-anchor="start" >new sources</text>
<text x="40" y="454" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#00e5ff" text-anchor="start" >2</text>
<text x="64" y="454" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e6f7ff" text-anchor="start" >Query</text>
<text x="140" y="454" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#9fb0c8" text-anchor="start" >ask anything</text>
<text x="40" y="478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#00e5ff" text-anchor="start" >3</text>
<text x="64" y="478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e6f7ff" text-anchor="start" >Lint</text>
<text x="140" y="478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#9fb0c8" text-anchor="start" >weekly tidy-up</text>
