<text x="640" y="434" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >“what did I</text>
<text x="640" y="456" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >decide about...?”</text>
